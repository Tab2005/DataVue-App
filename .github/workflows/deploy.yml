name: Deploy (Tencent Cloud)

# 建置 backend / frontend 映像推到 GHCR，再 SSH 到主機 pull 並重啟（deploy/docker-compose.prod.yml）
# 需要的 repository secrets：
#   DEPLOY_HOST     主機 IP
#   DEPLOY_SSH_KEY  部署用 SSH 私鑰（對應主機 ubuntu 帳號 authorized_keys）
# 切換到騰訊雲之前只手動觸發；正式切換後再加上 push: branches: [main]

on:
  workflow_dispatch:
    inputs:
      ssh_check_only:
        description: "只測試 SSH 連線與 secrets，不建置也不部署"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/tab2005

jobs:
  ssh-check:
    if: inputs.ssh_check_only
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Test SSH
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || { echo "::error::DEPLOY_HOST 未設定"; exit 1; }
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo "::error::DEPLOY_SSH_KEY 未設定"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.DEPLOY_HOST }} \
            "hostname && docker --version && ls -l /opt/edge/certs"

  build:
    if: ${{ !inputs.ssh_check_only }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: deploy/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/datavue-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/datavue-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose and edge site files
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml \
            ubuntu@${{ secrets.DEPLOY_HOST }}:/opt/datavue/
          scp -i ~/.ssh/deploy_key deploy/edge/sites/datavue.caddy \
            ubuntu@${{ secrets.DEPLOY_HOST }}:/opt/edge/sites/

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.DEPLOY_HOST }} \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='${{ github.actor }}' IMAGE_TAG='${{ github.sha }}' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/datavue
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export IMAGE_TAG COMMIT_REF="$IMAGE_TAG"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker logout ghcr.io
          # 共用 edge Caddy 重新載入 sites/datavue.caddy（設定有誤時 reload 會失敗，舊設定繼續生效）
          docker compose -f /opt/edge/docker-compose.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker image prune -af --filter "until=168h"
          docker compose -f docker-compose.prod.yml ps
          EOF
